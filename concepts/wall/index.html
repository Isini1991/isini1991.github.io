<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Esi Khoshhal | Web Designer &amp; Creative Developer</title>
<meta name="description" content="Esi is a web designer and creative developer making digital experiences for artists and independent brands.">
<meta name="theme-color" content="#f39a7c">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../space/space.css">
</head>
<body class="grab">
<canvas id="space" aria-label="A wall of websites in the dunes"></canvas>

<header class="top">
  <a class="logo" id="home" href="#">Esi</a>
  <nav class="nav" aria-label="Main">
    <button class="btn glass" id="openList" type="button">All projects</button>
    <a class="btn light" href="mailto:es.khoshhal@gmail.com">Contact</a>
  </nav>
</header>

<section class="intro" aria-label="Introduction">
  <div class="kick">Web designer &amp; creative developer</div>
  <h1 id="name">Esi Khoshhal</h1>
  <p>Websites for artists, musicians and independent brands</p>
  <div class="go">
    <button class="btn solid" id="enter" type="button">Enter the work</button>
  </div>
</section>

<div class="hint">Drag to explore · Scroll to zoom · Click a site</div>
<div class="tip" id="tip"></div>

<aside class="panel" aria-live="polite">
  <button class="x" id="pClose" type="button" aria-label="Close">×</button>
  <div class="num" id="pNum"></div>
  <h2 id="pTitle"></h2>
  <div class="client" id="pClient"></div>
  <ul class="tags" id="pTags"></ul>
  <p class="sum" id="pSum"></p>
  <div class="acts">
    <button class="btn solid" id="pInside" type="button">Step inside</button>
    <a class="btn ghost" id="pVisit" target="_blank" rel="noopener">Visit site ↗</a>
  </div>
  <div class="pn">
    <button id="pPrev" type="button">← Prev</button>
    <button id="pNext" type="button">Next →</button>
  </div>
</aside>

<div class="list" id="list">
  <div class="sheet">
    <div class="sheet-head"><h3>All projects</h3><button class="btn ghost" id="closeList" type="button">Close</button></div>
    <ol id="listItems"></ol>
  </div>
</div>

<div class="live" id="live" aria-hidden="true">
  <iframe id="frame" title="Live site"></iframe>
  <div class="bar"><button class="btn" id="back" type="button">← Back to the space</button><a class="btn" id="ext" target="_blank" rel="noopener">Open in new tab ↗</a></div>
</div>

<div class="loader" id="loader" aria-hidden="true"><div>Esi Khoshhal<small id="ln">000</small></div></div>

<script>window.SPACE_MODE = "wall";</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="../../projects.js"></script>
<script src="../space/space.js"></script>
</body>
</html>

<style>
  :root { --bg:#050505; --ink:#f0efea; --dim:rgba(240,239,234,.55); --line:rgba(240,239,234,.16); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:"Geist", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body { overscroll-behavior:none; touch-action:none; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  canvas#world { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* chrome */
  .top { position:fixed; inset:0 0 auto 0; display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px; z-index:5; }
  .logo { font-weight:600; font-size:19px; letter-spacing:.02em; }
  .nav { display:flex; align-items:center; gap:26px; font-size:13px; }
  .nav .dash { width:18px; height:1px; background:var(--ink); opacity:.7; }
  .nav button, .nav a { opacity:.86; transition:opacity .2s; }
  .nav button:hover, .nav a:hover { opacity:1; }
  .pill { display:inline-flex; align-items:center; gap:10px; height:36px; padding:0 18px; border-radius:99px;
    font-size:13px; font-weight:500; }
  .pill.solid { background:var(--ink); color:#050505; box-shadow:0 0 30px rgba(255,190,120,.25); opacity:1 !important; }
  .pill.ghost { border:1px solid var(--line); background:rgba(5,5,5,.35); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--dim); }
  .pill.ghost:hover { color:var(--ink); border-color:rgba(240,239,234,.4); }

  /* scene text */
  .stage { position:fixed; inset:0; z-index:3; pointer-events:none; }
  .title { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); text-align:center; width:min(92vw,1100px); }
  .title h1 { font-weight:600; font-size:clamp(34px,4.6vw,72px); line-height:1.02; letter-spacing:-.025em;
    text-shadow:0 2px 50px rgba(0,0,0,.7), 0 0 18px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.5); }
  .title h1 .ch { display:inline-block; opacity:0; transform:translateY(.35em); filter:blur(8px);
    transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1), filter .7s; }
  .title.in h1 .ch { opacity:1; transform:none; filter:none; }
  .title { transition:top 0s .12s; }
  body.work .title { top:77%; }
  body.work .title h1 { font-size:clamp(30px,3.6vw,58px); }
  .title p { margin-top:14px; font-size:14px; color:var(--dim); opacity:0; transition:opacity .6s .35s; text-shadow:0 1px 20px rgba(0,0,0,.8); }
  .title.in p { opacity:1; }
  .side { position:absolute; top:47%; font-size:13px; opacity:0; transition:opacity 1s .4s; transform:translateY(-50%); }
  .side.l { left:28px; } .side.r { right:28px; text-align:right; }
  .intro .side { opacity:.86; }

  .bottom { position:fixed; left:0; right:0; bottom:0; z-index:4; display:grid; grid-template-columns:1fr auto 1fr;
    align-items:end; padding:0 28px 26px; font-size:13px; }
  .nb { display:flex; flex-direction:column; gap:3px; opacity:.9; transition:opacity .3s; max-width:40vw; }
  .nb small { font-size:9px; letter-spacing:.12em; text-transform:uppercase; opacity:.6; }
  .nb b { font-weight:500; }
  .nb.r { align-items:flex-end; text-align:right; justify-self:end; }
  .nb.hide { opacity:0; pointer-events:none; }
  .center { justify-self:center; }
  .count { position:fixed; left:28px; top:50%; transform:translateY(-50%); z-index:4; font-size:11px; letter-spacing:.08em;
    color:var(--dim); writing-mode:vertical-rl; rotate:180deg; display:none; }
  .arrow { display:inline-block; width:8px; height:8px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:translateY(-2px) rotate(45deg); }

  /* loader */
  .loader { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:#050505; transition:opacity .9s .1s, visibility 0s 1s; }
  .loader.done { opacity:0; visibility:hidden; }
  .loader .n { font-size:12px; letter-spacing:.1em; color:var(--dim); margin-top:14px; text-align:center; font-variant-numeric:tabular-nums; }
  .loader .w { font-weight:600; font-size:22px; letter-spacing:.04em; }

  /* index overlay */
  .index { position:fixed; inset:0; z-index:10; background:rgba(5,5,5,.86); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:opacity .45s, visibility 0s .45s; }
  .index.open { opacity:1; visibility:visible; transition:opacity .45s; }
  .index ol { list-style:none; columns:2; column-gap:80px; width:min(900px,86vw); }
  .index li { break-inside:avoid; border-top:1px solid var(--line); }
  .index li button { display:flex; width:100%; justify-content:space-between; align-items:baseline; gap:20px; padding:13px 0; text-align:left; }
  .index li b { font-weight:500; font-size:clamp(17px,1.6vw,22px); }
  .index li span { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45%; }
  .index li button:hover b { color:#fff; text-shadow:0 0 18px rgba(255,255,255,.4); }
  .index .x { position:absolute; top:22px; right:28px; }

  /* live site */
  .live { position:fixed; inset:0; z-index:8; opacity:0; visibility:hidden; transition:opacity .5s, visibility 0s .5s; background:#050505; }
  .live.open { opacity:1; visibility:visible; transition:opacity .6s; }
  .live iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .live .bar { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:8px; z-index:2; }
  .live .bar .pill { background:rgba(5,5,5,.72); color:var(--ink); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }

  .hint { position:fixed; left:50%; top:calc(47% + 120px); transform:translateX(-50%); z-index:4; font-size:11px; color:var(--dim); letter-spacing:.06em; pointer-events:none; opacity:0; transition:opacity .4s; }
  body.hovering .hint { opacity:1; }
  body.hovering { cursor:pointer; }
  .stage, .bottom { transition:opacity .4s; }
  body.inside .stage, body.inside .bottom, body.inside .hint { opacity:0; pointer-events:none; }

  .contact-links { position:absolute; left:50%; top:calc(47% + 70px); transform:translateX(-50%); display:flex; gap:10px; pointer-events:auto; opacity:0; transition:opacity .6s .5s; }
  .contact .contact-links { opacity:1; }

  @media (max-width:760px) {
    .top { padding:16px 18px; }
    .nav { gap:14px; } .nav .dash, .nav .about { display:none; }
    .side { display:none; }
    .title { top:44%; }
    body.work .title { top:79%; }
    body.work .title h1 { font-size:30px; }
    .title p { margin-top:8px; font-size:13px; }
    .bottom { padding:0 18px 20px; grid-template-columns:1fr 1fr; row-gap:14px; }
    .bottom .center { grid-column:1 / -1; grid-row:1; }
    .index ol { columns:1; }
    .hint { display:none; }
    .contact-links { flex-direction:column; align-items:center; top:calc(44% + 64px); }
  }
  @media (prefers-reduced-motion:reduce) { .title h1 .ch { transition:none; } }
</style>

<div class="loader" id="loader"><div><div class="w">Esi</div><div class="n" id="ln">000</div></div></div>

    <div class="contact-links">
      <a class="pill solid" href="mailto:es.khoshhal@gmail.com">es.khoshhal@gmail.com</a>
      <a class="pill ghost" href="https://www.instagram.com/xoshhaal/" target="_blank" rel="noopener">Instagram</a>

</div>

<script src="../../projects.js"></script>
<script>
(() => {
const IMG = "img/";
// Order and art for this concept. Titles must match projects.js.
const PICK = [
  ["False Gods", "false-gods"],
  ["Oráculo Records", "oraculo"],
  ["Tristan Bejawn", "tristanbejawn"],
  ["The Monolith Project", "themonolithproject", "themonolithproject-scene-poster.webp", "themonolithproject-scene-poster.webp"],
  ["Faih Bitrou", "faih-bitrou"],
  ["VIGOR", "vigorvigorous"],
  ["boy", "learnwithregrets"],
  ["Sina Golnoghreh", "sinawings"],
  ["Origins Inconclusive", "originsinconclusive"],
  ["Matthew Joseph", "matthewjoseph"],
  ["DJ Lofi", "dj-lofi"],
  ["instinkt lab", "instinktlab"],
  ["Dais Records", "daisrecords"],
];
const NO_FRAME = ["vigorvigorous.com", "daisrecords.com", "brentfoster.com"];
const portrait = () => innerWidth / innerHeight < 0.8;

const all = window.PROJECTS || [];
const scenes = [{ type: "intro", title: "Esi Khoshhal", sub: "Websites for artists, musicians and independent brands" }];
for (const [t, slug, desk, mob] of PICK) {
  const p = all.find(x => x.title === t); if (!p) continue;
  scenes.push({ type: "work", title: p.title, sub: p.client, url: p.url,
    framable: !NO_FRAME.some(h => p.url.includes(h)),
    desk: IMG + (desk || `${slug}-desktop.webp`), mob: IMG + (mob || `${slug}-mobile.webp`) });
}
scenes.push({ type: "contact", title: "Let’s make yours.", sub: "Taking on new projects. Tell me about the work." });
const N = scenes.length, LAST = N - 1;

/* ---------- WebGL ---------- */
const cv = document.getElementById("world");
const gl = cv.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });
if (!gl) { document.body.innerHTML = '<p style="padding:40px">This concept needs WebGL2.</p>'; return; }

const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime, uPos, uSpacing, uZoom, uOpen, uZoomSlot, uCy;
uniform vec2 uHalf, uMouse;
uniform sampler2D uT0, uT1, uT2, uT3;
uniform vec4 uInfo[4];   // x hasTex, y texAspect, z scene index, w visible
uniform vec3 uGlow[4];
out vec4 o;

float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*vn(p); p=p*2.03+17.1; a*=.5; } return s; }
float sdBox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }

vec3 tex(int i, vec2 uv, vec2 dx, vec2 dy){
  if(i==0) return textureGrad(uT0,uv,dx,dy).rgb;
  if(i==1) return textureGrad(uT1,uv,dx,dy).rgb;
  if(i==2) return textureGrad(uT2,uv,dx,dy).rgb;
  return textureGrad(uT3,uv,dx,dy).rgb;
}

void main(){
  vec2 p = (gl_FragCoord.xy - .5*uRes) / uRes.y;
  float asp = uRes.x / uRes.y;
  float t = uTime;
  float px = 1.5 / uRes.y;
  float camX = uPos * uSpacing;
  vec2 m = uMouse;

  // dune crest the portals stand behind
  float wx = p.x + camX*.55;
  float crest = uCy - uHalf.y*.74 + .028*sin(wx*2.3+1.7) + .07*(fbm(vec2(wx*1.1, 2.7))-.5) - uZoom*.9;

  vec3 col = vec3(0.);
  vec3 light = vec3(0.);
  float insideAny = 0.;
  float above = smoothstep(-px, px, p.y - crest);

  for(int i=0;i<4;i++){
    vec4 inf = uInfo[i];
    if(inf.w < .5) continue;
    float k = inf.z;
    float cx = (k - uPos) * uSpacing;
    float focus = clamp(1. - abs(cx)/(uSpacing*1.05), 0., 1.);
    float isZ = step(abs(k - uZoomSlot), .1) * uZoom;
    vec2 half_ = mix(uHalf * mix(.84, 1., focus), vec2(asp*.5+.08, .58), isZ);
    if(k < .5) half_ *= uOpen;
    vec2 c = vec2(cx, mix(uCy, 0., isZ)) + m*.012*focus*(1.-isZ);
    vec2 q = p - c;
    float seed = k*7.31;
    float edge = (1.-isZ);
    float d = sdBox(q, half_, .06*(1.-isZ));
    d += (fbm(q*2.2 + seed + vec2(t*.04, -t*.03)) - .5) * .11 * edge;
    d += (vn(q*26. + seed) - .5) * .012 * edge;
    float inside = smoothstep(px, -px, d);

    vec3 g = uGlow[i];
    float bright = mix(.3, 1., focus*focus);
    // light thrown from the opening
    light += g * bright * (exp(-max(d,0.)*7.)*.55 + exp(-max(d,0.)*42.)*.9) * edge;

    if(inside > 0.){
      vec3 c2;
      if(inf.x > .5){
        vec2 b = q / (2.*half_) + .5;
        float boxA = half_.x/half_.y, A = inf.y;
        vec2 s = vec2(1.);
        if(boxA > A) s.y = A/boxA; else s.x = boxA/A;
        float z = mix(.9, 1., isZ);
        vec2 uv = .5 + (b-.5)*s*z - m*.018*s*(1.-isZ);
        uv += (vec2(vn(b*5.+t*.15), vn(b*5.-t*.15+9.))-.5) * .006 * edge;
        vec2 dx = dFdx(uv), dy = dFdy(uv);
        c2 = tex(i, uv, dx, dy);
        float l = dot(c2, vec3(.3,.59,.11));
        c2 = mix(vec3(l), c2, mix(.25, 1., focus)) * bright;
        // inner falloff near the ragged edge, and a soft band so the title reads
        c2 *= mix(1., smoothstep(0., -.05, d)*.4+.6, edge);
      } else {
        // a void with slow drifting dust
        vec2 dq = q*28. + vec2(t*.25, t*.12);
        vec2 cell = floor(dq), f = fract(dq) - .5;
        vec2 off = vec2(h21(cell), h21(cell+3.1)) - .5;
        float r = length(f - off*.7);
        float tw = .5 + .5*sin(t*1.5 + h21(cell+7.)*6.28);
        float dust = smoothstep(.07, .0, r) * step(.82, h21(cell+11.)) * tw;
        c2 = vec3(.006) + dust*vec3(1.,.93,.82)*.8*smoothstep(0.,-.08,d);
      }
      float vis = inside * (isZ > .5 ? 1. : above);
      col = mix(col, c2, vis);
      insideAny = max(insideAny, vis);
    }
  }

  // sand in front, lit by the openings
  if(above < 1.){
    float depth = max(crest - p.y, 0.);
    float z = 1. / (depth*3. + .12);
    float rip = sin((p.x*z*.9 + camX*.35)*9. + fbm(vec2(wx*3., depth*7.))*5. + depth*40.);
    float tex_ = fbm(vec2(wx*14., depth*30.));
    float shade = .022 + .028*rip + .03*tex_;
    vec3 lit = light * (.55*exp(-depth*5.)) * (.75+.25*rip);
    vec3 sand = vec3(shade) + lit + vec3(.9,.95,1.)*exp(-depth*60.)*length(light)*.18;
    col = mix(sand, col, above);
  }
  // air glow behind
  col += light * .4 * above * (1. - insideAny) * (1. - smoothstep(-.1, .6, p.y)*.4);

  // vignette and grain
  col *= 1. - .45*pow(length(p/vec2(asp*.62, .62)), 2.6);
  col += (h21(gl_FragCoord.xy + fract(t)*317.) - .5) * .035;
  o = vec4(pow(max(col, 0.), vec3(.95)), 1.);
}`;

function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const u = { res: U("uRes"), time: U("uTime"), pos: U("uPos"), spacing: U("uSpacing"), zoom: U("uZoom"), open: U("uOpen"),
  zslot: U("uZoomSlot"), cy: U("uCy"), half: U("uHalf"), mouse: U("uMouse"), info: U("uInfo"), glow: U("uGlow") };
["uT0","uT1","uT2","uT3"].forEach((n, i) => gl.uniform1i(U(n), i));

const blank = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, blank);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

const textures = new Array(N).fill(null);
const glows = scenes.map(s => s.type === "work" ? [.5,.5,.5] : [.95, .88, .78]);
const aspects = new Array(N).fill(1.6);

function loadImg(src) { return new Promise(res => { const im = new Image(); im.decoding = "async";
  im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
function upload(i, im) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  textures[i] = t; aspects[i] = im.naturalWidth / im.naturalHeight;
  // average colour, lifted, becomes the light the opening throws
  const c = document.createElement("canvas"); c.width = c.height = 6; const x = c.getContext("2d");
  x.drawImage(im, 0, 0, 6, 6); const d = x.getImageData(0, 0, 6, 6).data; let r = 0, g = 0, b = 0;
  for (let k = 0; k < d.length; k += 4) { r += d[k]; g += d[k+1]; b += d[k+2]; }
  const n = d.length / 4; let v = [r/n/255, g/n/255, b/n/255]; const mx = Math.max(...v, .05);
  const lum = .3*v[0] + .59*v[1] + .11*v[2], gain = .55 + .35 * Math.min(1, lum * 2.2);
  v = v.map(c => gain * (.3 + .7 * Math.min(1, c / mx))); glows[i] = v;
}

/* ---------- state ---------- */
let pos = 0, target = 0, zoom = 0, zoomTarget = 0, open = 0, mx = 0, my = 0, smx = 0, smy = 0, settled = -1;
const half = [0, 0]; let spacing = 1, cy = .015;
function layout() {
  const dpr = Math.min(devicePixelRatio || 1, innerWidth < 760 ? 1.5 : 1.6);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
  const asp = innerWidth / innerHeight;
  if (portrait()) { half[0] = asp * .5 * .8; half[1] = .27; cy = .07; }
  else { half[0] = Math.min(asp * .5 * .6, .52); half[1] = Math.min(half[0] / 1.55, .33); cy = .03; }
  spacing = asp * .5 * .82 + half[0];
}
addEventListener("resize", () => { layout(); reloadForOrientation(); });
layout();

let lastPortrait = portrait();
function reloadForOrientation() {
  if (portrait() === lastPortrait) return; lastPortrait = portrait();
  scenes.forEach((s, i) => { if (s.type === "work") loadImg(lastPortrait ? s.mob : s.desk).then(im => im && upload(i, im)); });
}

/* ---------- text ---------- */
const $ = id => document.getElementById(id);
const titleEl = $("title"), h1 = $("h1"), sub = $("sub"), cta = $("cta");
function split(s) { return [...s].map((c, i) => c === " " ? " " : `<span class="ch" style="transition-delay:${i*22}ms">${c}</span>`).join(""); }
function showText(i) {
  const s = scenes[i];
  titleEl.classList.remove("in");
  document.body.classList.toggle("intro", s.type === "intro");
  setTimeout(() => document.body.classList.toggle("work", s.type === "work"), 120);
  titleEl.classList.toggle("contact", s.type === "contact");
  setTimeout(() => {
    h1.innerHTML = split(s.title); sub.textContent = s.sub || "";
    requestAnimationFrame(() => requestAnimationFrame(() => titleEl.classList.add("in")));
  }, 120);
  const pv = scenes[i-1], nx = scenes[i+1];
  $("prev").classList.toggle("hide", !pv); $("next").classList.toggle("hide", !nx);
  if (pv) $("prev").querySelector("b").textContent = pv.type === "intro" ? "Start" : pv.title;
  if (nx) $("next").querySelector("b").textContent = nx.type === "contact" ? "Contact" : nx.title;
  if (s.type === "intro") { cta.innerHTML = 'Scroll to start exploring <span class="arrow"></span>'; cta.href = "#"; cta.removeAttribute("target"); }
  else if (s.type === "work") { cta.innerHTML = s.framable ? "Step inside the site" : "Visit the site ↗";
    cta.href = s.url; cta.target = s.framable ? "" : "_blank"; }
  else { cta.innerHTML = "Back to the start"; cta.href = "#"; cta.removeAttribute("target"); }
}

/* ---------- input ---------- */
const go = i => { target = Math.max(0, Math.min(LAST, i)); };
let wheelAcc = 0, wheelLock = 0;
addEventListener("wheel", e => {
  e.preventDefault();
  if (zoomTarget || $("index").classList.contains("open")) return;
  const now = performance.now();
  wheelAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (now < wheelLock) { wheelAcc = 0; return; }
  if (Math.abs(wheelAcc) > 40) { go(Math.round(target) + Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = now + 650; }
}, { passive: false });
addEventListener("keydown", e => {
  if (e.key === "Escape") { closeLive(); $("index").classList.remove("open"); return; }
  if (zoomTarget) return;
  if (["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)) { e.preventDefault(); go(Math.round(target) + 1); }
  if (["ArrowLeft","ArrowUp","PageUp"].includes(e.key)) { e.preventDefault(); go(Math.round(target) - 1); }
  if (e.key === "Enter") stepInside();
});
// drag / swipe moves the camera continuously, then snaps
let drag = null;
cv.addEventListener("pointerdown", e => { if (zoomTarget) return; drag = { x: e.clientX, y: e.clientY, t0: target, moved: 0 }; });
addEventListener("pointermove", e => {
  mx = (e.clientX / innerWidth - .5) * 2; my = -(e.clientY / innerHeight - .5) * 2;
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y, d = Math.abs(dx) > Math.abs(dy) ? dx : dy;
    drag.moved = Math.max(drag.moved, Math.abs(d));
    target = Math.max(0, Math.min(LAST, drag.t0 - d / (innerWidth * .45)));
  }
  updateHover(e.clientX, e.clientY);
});
addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved < 6) { if (overPortal(e.clientX, e.clientY)) stepInside(); else target = Math.round(d.t0); return; }
  const delta = target - d.t0;
  go(Math.abs(delta) > .12 ? (delta > 0 ? Math.ceil(target) : Math.floor(target)) : Math.round(d.t0));
});
function overPortal(x, y) {
  const s = scenes[Math.round(pos)]; if (!s || s.type !== "work" || Math.abs(pos - Math.round(pos)) > .05) return false;
  const px = (x - innerWidth / 2) / innerHeight, py = -(y - innerHeight / 2) / innerHeight;
  return Math.abs(px) < half[0] * .92 && Math.abs(py - cy) < half[1] * .92 && py > cy - half[1] * .6;
}
function updateHover(x, y) { document.body.classList.toggle("hovering", !zoomTarget && overPortal(x, y)); }

document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); $("index").classList.remove("open");
  go(b.dataset.go === "last" ? LAST : +b.dataset.go); }));
$("prev").onclick = () => go(Math.round(target) - 1);
$("next").onclick = () => go(Math.round(target) + 1);
cta.addEventListener("click", e => {
  const s = scenes[Math.round(target)];
  if (s.type === "intro") { e.preventDefault(); go(1); }
  else if (s.type === "contact") { e.preventDefault(); go(0); }
  else if (s.framable) { e.preventDefault(); stepInside(); }
});

/* index */
$("list").innerHTML = scenes.map((s, i) => s.type === "work"
  ? `<li><button data-i="${i}"><b>${s.title}</b><span>${s.sub}</span></button></li>` : "").join("");
$("list").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; $("index").classList.remove("open"); go(+b.dataset.i); });
$("openIndex").onclick = () => $("index").classList.add("open");
$("closeIndex").onclick = () => $("index").classList.remove("open");

/* step inside: the opening grows to fill the screen, then the real site loads */
let zoomSlot = -1;
function stepInside() {
  const i = Math.round(target), s = scenes[i];
  if (!s || s.type !== "work") return;
  if (!s.framable) { window.open(s.url, "_blank", "noopener"); return; }
  zoomSlot = i; zoomTarget = 1; document.body.classList.remove("hovering"); document.body.classList.add("inside");
  $("ext").href = s.url;
  setTimeout(() => { $("frame").src = s.url; $("live").classList.add("open"); }, 900);
}
function closeLive() {
  if (!zoomTarget) return;
  $("live").classList.remove("open");
  setTimeout(() => { $("frame").src = "about:blank"; zoomTarget = 0; document.body.classList.remove("inside"); }, 350);
}
$("back").onclick = closeLive;

/* ---------- loop ---------- */
const info = new Float32Array(16), glowArr = new Float32Array(12);
const t0 = performance.now();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let prevT = performance.now();
function frame(now) {
  const t = (now - t0) / 1000, dt = Math.min(.1, (now - prevT) / 1000); prevT = now;
  const k = reduce ? 1 : 1 - Math.exp(-dt * 4.2);
  pos += (target - pos) * (drag ? 1 - Math.exp(-dt * 20) : k);
  if (Math.abs(target - pos) < 1e-4) pos = target;
  zoom += (zoomTarget - zoom) * (1 - Math.exp(-dt * 4));
  smx += (mx - smx) * (1 - Math.exp(-dt * 3)); smy += (my - smy) * (1 - Math.exp(-dt * 3));
  const near = Math.round(pos);
  if (Math.abs(pos - near) < .12 && near !== settled) { settled = near; showText(near); }
  if (Math.abs(pos - near) > .3 && settled !== -1) { titleEl.classList.remove("in"); settled = -1; }

  const base = Math.floor(pos) - 1;
  for (let s = 0; s < 4; s++) {
    const idx = base + s, ok = idx >= 0 && idx < N;
    gl.activeTexture(gl.TEXTURE0 + s);
    gl.bindTexture(gl.TEXTURE_2D, ok && textures[idx] ? textures[idx] : blank);
    info[s*4] = ok && textures[idx] ? 1 : 0; info[s*4+1] = ok ? aspects[idx] : 1;
    info[s*4+2] = idx; info[s*4+3] = ok ? 1 : 0;
    const g = ok ? glows[idx] : [0,0,0]; glowArr[s*3] = g[0]; glowArr[s*3+1] = g[1]; glowArr[s*3+2] = g[2];
  }
  gl.uniform2f(u.res, cv.width, cv.height); gl.uniform1f(u.time, t);
  gl.uniform1f(u.pos, pos); gl.uniform1f(u.spacing, spacing); gl.uniform1f(u.zoom, zoom);
  gl.uniform1f(u.open, open); gl.uniform1f(u.cy, cy); gl.uniform1f(u.zslot, zoomSlot);
  gl.uniform2f(u.half, half[0], half[1]); gl.uniform2f(u.mouse, smx, smy);
  gl.uniform4fv(u.info, info); gl.uniform3fv(u.glow, glowArr);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

/* ---------- load ---------- */
const ln = $("ln"); let loaded = 0; const jobs = scenes.map((s, i) => s.type !== "work" ? Promise.resolve() :
  loadImg(portrait() ? s.mob : s.desk).then(im => { if (im) upload(i, im); loaded++; ln.textContent = String(Math.round(loaded / (N-2) * 100)).padStart(3, "0"); }));
requestAnimationFrame(frame);
Promise.all(jobs).then(() => {
  $("loader").classList.add("done");
  const st = performance.now();
  (function grow(n) { const p = Math.min(1, (n - st) / 1800); open = 1 - Math.pow(1 - p, 3); if (p < 1) requestAnimationFrame(grow); })(st);
});
})();
</script>
</body>
</html>
